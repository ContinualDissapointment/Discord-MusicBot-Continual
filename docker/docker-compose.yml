services:
  djs-bot-navi:
    container_name: djs-bot-navi
    build:
      context: ..
      dockerfile: ./docker/djs-bot-navi/Dockerfile
    restart: "unless-stopped"
    init: true
    environment:
      - TOKEN=${TOKEN}
      - CLIENTID=${CLIENTID}
      - CLIENTSECRET=${CLIENTSECRET}
      - DEVUID=${DEVUID}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
    stdin_open: true
    tty: true
    volumes:
      - ../djs-bot-navi:/djs-bot-navi
    depends_on:
      - lavalink-navi
    ports:
      - "8081:8081"
      - "3002:3002"
    working_dir: /djs-bot-navi
    command: ["npm", "run", "${ENABLE:-start}", "--loglevel=error"]
    env_file:
      - .env
      - lavalink.env

  lavalink-navi:
    image: fredboat/lavalink:3.7.13
    container_name: lavalink-navi
    restart: unless-stopped
    hostname: docker.lavalink
    user: root
    volumes:
      - ./lavalink/application.yml:/opt/Lavalink/application.yml
      - ./lavalink/plugins/:/opt/Lavalink/plugins
    ports:
      - 2334:2334
    env_file:
      - lavalink.env
